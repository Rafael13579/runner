name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Cosign (Versão Fixa)
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: 'v2.2.3' 

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish simulador.jar when available
        if: hashFiles('simulador.jar') != ''
        run: |
          sha256sum simulador.jar > simulador.jar.sha256
          gh release upload "${GITHUB_REF_NAME}" simulador.jar simulador.jar.sha256 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
