version: 2

project_name: assinatura

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/assinatura/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Injeta a versão na sua variável Version dentro do pacote cli
    ldflags:
      - -s -w -X github.com/kyriosdata/assinatura/cli.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# US-05.3: Assinatura com Cosign
signs:
  - artifacts: checksum
    args: ["sign-blob", "--output-signature", "${signature}", "${artifact}", "--yes"]